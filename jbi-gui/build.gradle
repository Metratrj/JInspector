plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'xyz.metratrj'
version = 'unspecified'

repositories {
    mavenCentral()
}

javafx {
    version = 25
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainModule = 'xyz.metratrj.jbyteinspector.gui'
    mainClass = 'xyz.metratrj.jbyteinspector.gui.BaseWindow'
}


dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}