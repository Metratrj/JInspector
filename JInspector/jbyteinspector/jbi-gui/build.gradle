plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'xyz.metratrj.jbyteinspector-gui'
version = 'unspecified'

repositories {
    mavenCentral()
}

application {
    mainClass = 'xyz.metratrj.jbyteinspectorgui.Main'
}

javafx {
    version = '25'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

dependencies {
    implementation project(':jbyteinspector:jbi-core')
    implementation project(':jbyteinspector:jbi-io')
    implementation project(':jbyteinspector:jbi-model')
    implementation project(':jbyteinspector:jbi-parser')

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}